name: Native Windows TLS and crypto backends
on:
  push:
    branches: [feat/tls-crypto-backends]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tls-crypto-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kafka-java-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract Java libraries from the pinned official Kafka image
        shell: bash
        run: |
          set -euo pipefail
          image='apache/kafka:4.1.1@sha256:7240ff4534bd23dac2f215ba03a2d0aa9d041b45b830804bbdec3b81c2bdf479'
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm -f "$container"' EXIT
          mkdir -p kafka-java
          docker cp "$container:/opt/kafka/libs" kafka-java/libs
          test -f kafka-java/libs/kafka_2.13-4.1.1.jar
      - name: Transfer only public Java distribution libraries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kafka-java-libraries
          path: kafka-java/libs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  schannel-bcrypt:
    needs: kafka-java-distribution
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install test-only certificate tooling
        run: python -m pip install cryptography==50.0.2
      - name: Obtain verified official Kafka Java libraries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kafka-java-libraries
          path: ${{ runner.temp }}/kafka-native/libs
      - name: Configure native static backend tests
        run: >-
          cmake -S . -B build-static -A x64
          -DRDKAFKA_TLS_BACKEND=schannel -DRDKAFKA_CRYPTO_BACKEND=bcrypt
          -DRDKAFKA_BUILD_STATIC=ON -DRDKAFKA_BUILD_BACKEND_TESTS=ON
          -DRDKAFKA_BUILD_TESTS=ON -DRDKAFKA_BUILD_EXAMPLES=OFF
          -DWITH_CURL=OFF -DWITH_ZLIB=OFF -DWITH_ZSTD=OFF
          -DWITH_HDRHISTOGRAM=OFF -DENABLE_LZ4_EXT=OFF -DWITH_SASL=ON
      - name: Build native static backend tests
        id: native_build
        run: cmake --build build-static --config Release --parallel 4
      - name: Run local unit, configuration and Admin tests
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        working-directory: tests
        shell: pwsh
        run: |
          $env:TESTS = '0000,0004,0080'
          ..\build-static\tests\Release\test-runner.exe -l
          if ($LASTEXITCODE -ne 0) { throw 'Local tests failed' }
      - name: Exercise BCrypt primitives and verify JOSE signatures independently
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python tests/crypto/run_vectors.py --binary build-static/Release/backend-crypto-test.exe
      - name: Exercise public certificate setter lifetime and encodings
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python tests/tls_backend/run_cert_buffers.py --binary build-static/Release/backend-cert-test.exe
      - name: Exercise real Schannel TLS and mutual authentication
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python tests/schannel_transport.py --client build-static/Release/backend-schannel-test.exe
      - name: Exercise native broker transport against real Java Kafka
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          python tests/tls_backend/native_java_kafka.py --client build-static/Release/backend-kafka-client.exe --distribution "$env:RUNNER_TEMP\kafka-native"
          if ($LASTEXITCODE -ne 0) { throw 'Native Java Kafka acceptance failed' }
      - name: Configure shared artifact dependency audit
        id: configure_shared
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cmake -S . -B build-shared -A x64
          -DRDKAFKA_TLS_BACKEND=schannel -DRDKAFKA_CRYPTO_BACKEND=bcrypt
          -DRDKAFKA_BUILD_STATIC=OFF -DRDKAFKA_BUILD_TESTS=OFF
          -DRDKAFKA_BUILD_EXAMPLES=OFF -DWITH_CURL=OFF -DWITH_ZLIB=OFF
          -DWITH_ZSTD=OFF -DWITH_HDRHISTOGRAM=OFF -DENABLE_LZ4_EXT=OFF
          -DWITH_SASL=ON -DCMAKE_SHARED_LINKER_FLAGS=/MAP
      - name: Build shared Schannel and BCrypt artifact
        id: shared_build
        if: ${{ !cancelled() && steps.configure_shared.outcome == 'success' }}
        run: cmake --build build-shared --config Release --target rdkafka --parallel 4
      - name: Verify Windows crypto imports and absence of OpenSSL
        if: ${{ !cancelled() && steps.shared_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $dll = Get-ChildItem build-shared -Recurse -Filter '*rdkafka.dll' | Select-Object -First 1
          if (!$dumpbin -or !$dll) { throw 'Dependency audit tools or artifact missing' }
          $imports = & $dumpbin.FullName /DEPENDENTS $dll.FullName | Out-String
          Write-Output $imports
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($imports -match 'libssl|libcrypto|ssleay|libeay|openssl') { throw 'Unexpected OpenSSL dependency' }
          foreach ($module in @('bcrypt.dll','ncrypt.dll','crypt32.dll','secur32.dll')) {
            if ($imports -notmatch [regex]::Escape($module)) { throw "Required Windows module missing: $module" }
          }
          $functions = & $dumpbin.FullName /IMPORTS $dll.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Function import audit failed' }
          foreach ($function in @('BCryptGenRandom','BCryptDeriveKeyPBKDF2','BCryptCreateHash','NCryptSignHash','InitializeSecurityContextA')) {
            if ($functions -notmatch [regex]::Escape($function)) { throw "Required backend function missing: $function" }
          }
          $maps = Get-ChildItem build-shared -Recurse -Filter '*.map'
          if (!$maps) { throw 'Native link map missing' }
          foreach ($map in $maps) {
            if ((Get-Content $map.FullName -Raw) -match '(libssl|libcrypto|ssleay|libeay)\.(lib|a)') {
              throw 'Unexpected static OpenSSL input in link map'
            }
          }
  schannel-bcrypt-curl:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install libcurl with the Schannel backend
        run: vcpkg install curl:x64-windows
      - name: Configure Schannel, BCrypt and libcurl
        shell: pwsh
        run: >-
          cmake -S . -B build-curl -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_MODE=OFF
          -DRDKAFKA_TLS_BACKEND=schannel -DRDKAFKA_CRYPTO_BACKEND=bcrypt
          -DRDKAFKA_BUILD_STATIC=ON -DRDKAFKA_BUILD_TESTS=ON
          -DRDKAFKA_BUILD_EXAMPLES=OFF -DWITH_CURL=ON -DWITH_ZLIB=OFF
          -DWITH_ZSTD=OFF -DWITH_HDRHISTOGRAM=OFF -DENABLE_LZ4_EXT=OFF
          -DWITH_SASL=ON
      - name: Build the test runner
        run: cmake --build build-curl --config Release --target test-runner --parallel 4
      - name: Run OIDC unit tests and HTTPS configuration tests
        working-directory: tests
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $env:TESTS = '0000,0004'
          ..\build-curl\tests\Release\test-runner.exe -l
          if ($LASTEXITCODE -ne 0) { throw 'Local tests with libcurl failed' }
